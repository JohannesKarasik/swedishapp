{% load static %}

<header class="site-header">
  <div class="wrap wrap--header">
    <a href="/" class="logo" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
      <img
        src="{% static 'checker/logo.png' %}"
        alt="RättaText"
        style="height:54px; width:auto; display:block;"
      >
    </a>

    <div class="header-actions">
      {% if user.is_authenticated %}
      <a href="{% url 'settings' %}" class="header-link">Inställningar</a>

        <form method="post" action="{% url 'logout' %}" style="margin:0;">
          {% csrf_token %}
          <button type="submit" class="header-link header-link--button">Logga ut</button>
        </form>
      {% else %}
        <button type="button" class="header-link header-link--button" onclick="window.openAuthModal?.()">
          Logga in
        </button>
        <button type="button" class="header-link header-link--button" onclick="window.openRegisterModal?.()">
          Skapa konto
        </button>
      {% endif %}

      <!-- Kontakt (always visible, logged in or out) -->
      <button type="button" class="header-link header-link--button header-link--contact" onclick="openContactModal()">
        Kontakt
      </button>
    </div>
  </div>

  <hr style="border:0;border-top:1px solid var(--border); margin:0;">
</header>

<!-- CONTACT MODAL -->
<div id="contact-modal" class="contact-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="contact-modal__backdrop" onclick="closeContactModal()"></div>

  <div class="contact-modal__card" role="document">
    <button type="button" class="contact-modal__close" aria-label="Stäng" onclick="closeContactModal()">×</button>

    <h3 class="contact-modal__title">Kontakt</h3>
    <p class="contact-modal__text">
      Skicka oss ett mejl på:
      <a class="contact-modal__email" href="mailto:textflowsupportmail@gmail.com">textflowsupportmail@gmail.com</a>
    </p>
  </div>
</div>

<script>
  function openContactModal() {
    const modal = document.getElementById("contact-modal");
    if (!modal) return;
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.addEventListener("keydown", onContactModalKeydown);
  }

  function closeContactModal() {
    const modal = document.getElementById("contact-modal");
    if (!modal) return;
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.removeEventListener("keydown", onContactModalKeydown);
  }

  function onContactModalKeydown(e) {
    if (e.key === "Escape") closeContactModal();
  }
</script>

<style>
  .site-header .wrap--header{
    display:flex;
    align-items:center;
    justify-content:space-between; /* logo left, buttons right */
    gap:16px;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .header-link{
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    padding: 6px 0;
    background: none;
    border: 0;
    cursor: pointer;
  }

  .header-link:hover{
    text-decoration: underline;
  }

  .header-link--button{
    appearance:none;
    -webkit-appearance:none;
  }

  /* =========================
     CONTACT MODAL STYLES
     ========================= */
  .contact-modal{
    position: fixed;
    inset: 0;
    display: none;
    z-index: 9999;
  }

  .contact-modal.is-open{
    display: block;
  }

  .contact-modal__backdrop{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.45);
  }

  .contact-modal__card{
    position: relative;
    width: min(420px, calc(100% - 32px));
    margin: 120px auto 0;
    background: #fff;
    border-radius: 14px;
    padding: 18px 18px 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .contact-modal__close{
    position:absolute;
    top: 8px;
    right: 10px;
    border: 0;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }

  .contact-modal__title{
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 700;
  }

  .contact-modal__text{
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
  }

  .contact-modal__email{
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
  }

  .contact-modal__email:hover{
    text-decoration: underline;
  }
</style>
